# .github/workflows/release.yml
# Auto-generated by XoopsCore27 language toolchain
# Re-run: scripts/generate-language-manifests.php

name: Package & Release Language Assets

on:
  push:
    branches: [master, main]
    paths:
      - 'core/**'
      - 'modules/**'
      - 'themes/**'
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Discover language name from manifest.json ────────────────────────────
      - name: Read manifest
        id: meta
        run: |
          LANG=$(jq -r .language manifest.json)
          TODAY=$(date +%Y-%m-%d)
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      # ── Work out exactly which tracked files this push touched, so only the ───
      # ── assets that actually changed get rebuilt and re-uploaded. Re-uploading ──
      # ── an unchanged asset to a GitHub Release resets its download counter ────
      # ── and "updated" timestamp, so a full rebuild should only happen for a ────
      # ── manual dispatch or a repo's very first push. ────────────────────────
      - name: Determine changed paths
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Full rebuild (manual dispatch, or no prior commit to diff against)."
            CHANGED=$(git ls-files core modules themes manifest.json)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- core modules themes manifest.json)
          fi
          echo "Changed paths for this run:"
          echo "$CHANGED"
          {
            echo "files<<CHANGED_FILES_EOF"
            echo "$CHANGED"
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package core 2.7.0
        if: ${{ contains(steps.changes.outputs.files, 'core/2.7.0/') }}
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          HAS_CONTENT=false
          for d in htdocs install upgrade; do
            [ -d "core/2.7.0/$d" ] && HAS_CONTENT=true
          done
          if [ "$HAS_CONTENT" = false ]; then
            echo "::warning title=Incomplete language pack (${LANG})::core/2.7.0 has no htdocs/, install/, or upgrade/ directory yet. Nothing to package -- coverage will show 0% until translators add files."
            exit 0
          fi
          cd core/2.7.0
          zip -r "../../${LANG}-core-2.7.0.zip" htdocs/ install/ upgrade/ \
              --exclude "*.bat" --exclude "*.txt" --exclude "*/.git/*"
          cd ../..
          if [ -s "${LANG}-core-2.7.0.zip" ]; then
            echo "Packaged ${LANG}-core-2.7.0.zip"
          else
            echo "::warning title=Empty package (${LANG})::Zip produced no usable output for core 2.7.0."
            rm -f "${LANG}-core-2.7.0.zip"
          fi

      - name: Package core 2.7.1
        if: ${{ contains(steps.changes.outputs.files, 'core/2.7.1/') }}
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          HAS_CONTENT=false
          for d in htdocs install upgrade; do
            [ -d "core/2.7.1/$d" ] && HAS_CONTENT=true
          done
          if [ "$HAS_CONTENT" = false ]; then
            echo "::warning title=Incomplete language pack (${LANG})::core/2.7.1 has no htdocs/, install/, or upgrade/ directory yet. Nothing to package -- coverage will show 0% until translators add files."
            exit 0
          fi
          cd core/2.7.1
          zip -r "../../${LANG}-core-2.7.1.zip" htdocs/ install/ upgrade/ \
              --exclude "*.bat" --exclude "*.txt" --exclude "*/.git/*"
          cd ../..
          if [ -s "${LANG}-core-2.7.1.zip" ]; then
            echo "Packaged ${LANG}-core-2.7.1.zip"
          else
            echo "::warning title=Empty package (${LANG})::Zip produced no usable output for core 2.7.1."
            rm -f "${LANG}-core-2.7.1.zip"
          fi

      - name: Package core 2.7.3
        if: ${{ contains(steps.changes.outputs.files, 'core/2.7.3/') }}
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          HAS_CONTENT=false
          for d in htdocs install upgrade; do
            [ -d "core/2.7.3/$d" ] && HAS_CONTENT=true
          done
          if [ "$HAS_CONTENT" = false ]; then
            echo "::warning title=Incomplete language pack (${LANG})::core/2.7.3 has no htdocs/, install/, or upgrade/ directory yet. Nothing to package -- coverage will show 0% until translators add files."
            exit 0
          fi
          cd core/2.7.3
          zip -r "../../${LANG}-core-2.7.3.zip" htdocs/ install/ upgrade/ \
              --exclude "*.bat" --exclude "*.txt" --exclude "*/.git/*"
          cd ../..
          if [ -s "${LANG}-core-2.7.3.zip" ]; then
            echo "Packaged ${LANG}-core-2.7.3.zip"
          else
            echo "::warning title=Empty package (${LANG})::Zip produced no usable output for core 2.7.3."
            rm -f "${LANG}-core-2.7.3.zip"
          fi

      - name: Package core 2.7.4
        if: ${{ contains(steps.changes.outputs.files, 'core/2.7.4/') }}
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          HAS_CONTENT=false
          for d in htdocs install upgrade; do
            [ -d "core/2.7.4/$d" ] && HAS_CONTENT=true
          done
          if [ "$HAS_CONTENT" = false ]; then
            echo "::warning title=Incomplete language pack (${LANG})::core/2.7.4 has no htdocs/, install/, or upgrade/ directory yet. Nothing to package -- coverage will show 0% until translators add files."
            exit 0
          fi
          cd core/2.7.4
          zip -r "../../${LANG}-core-2.7.4.zip" htdocs/ install/ upgrade/ \
              --exclude "*.bat" --exclude "*.txt" --exclude "*/.git/*"
          cd ../..
          if [ -s "${LANG}-core-2.7.4.zip" ]; then
            echo "Packaged ${LANG}-core-2.7.4.zip"
          else
            echo "::warning title=Empty package (${LANG})::Zip produced no usable output for core 2.7.4."
            rm -f "${LANG}-core-2.7.4.zip"
          fi

      - name: Package core 2.8.0
        if: ${{ contains(steps.changes.outputs.files, 'core/2.8.0/') }}
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          HAS_CONTENT=false
          for d in htdocs install upgrade; do
            [ -d "core/2.8.0/$d" ] && HAS_CONTENT=true
          done
          if [ "$HAS_CONTENT" = false ]; then
            echo "::warning title=Incomplete language pack (${LANG})::core/2.8.0 has no htdocs/, install/, or upgrade/ directory yet. Nothing to package -- coverage will show 0% until translators add files."
            exit 0
          fi
          cd core/2.8.0
          zip -r "../../${LANG}-core-2.8.0.zip" htdocs/ install/ upgrade/ \
              --exclude "*.bat" --exclude "*.txt" --exclude "*/.git/*"
          cd ../..
          if [ -s "${LANG}-core-2.8.0.zip" ]; then
            echo "Packaged ${LANG}-core-2.8.0.zip"
          else
            echo "::warning title=Empty package (${LANG})::Zip produced no usable output for core 2.8.0."
            rm -f "${LANG}-core-2.8.0.zip"
          fi

      # ── Package older core versions (EOL — frozen zips), only the ones that ────
      # ── actually changed in this push ──────────────────────────────────────
      - name: Package EOL core versions
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          CHANGED="${{ steps.changes.outputs.files }}"
          for ver_dir in core/*/; do
            ver=$(basename "$ver_dir")
            case "$ver" in
              2.7.0|2.7.1|2.7.3|2.7.4|2.8.0) continue ;;
            esac
            [ -d "$ver_dir" ] || continue
            echo "$CHANGED" | grep -qF "core/$ver/" || continue
            zip -r "${LANG}-core-${ver}.zip" "$ver_dir" \
                --exclude "*.bat" --exclude "*/.git/*" || true
            echo "Packaged ${LANG}-core-${ver}.zip"
          done

      # ── Package module translations, only modules/versions that changed ────
      - name: Package module translations
        run: |
          LANG="${{ steps.meta.outputs.lang }}"
          CHANGED="${{ steps.changes.outputs.files }}"
          if [ -d "modules" ]; then
            for mod_dir in modules/*/; do
              mod=$(basename "$mod_dir")

              # Unversioned legacy layout: modules/<mod>/language/...
              if [ -d "${mod_dir}language" ]; then
                echo "$CHANGED" | grep -qF "$mod_dir" || continue
                zip -r "${LANG}-module-${mod}.zip" "$mod_dir" \
                    --exclude "*.bat" --exclude "*/.git/*" || true
                echo "Packaged ${LANG}-module-${mod}.zip"
                continue
              fi

              for ver_dir in "$mod_dir"*/; do
                [ -d "$ver_dir" ] || continue
                echo "$CHANGED" | grep -qF "$ver_dir" || continue
                ver=$(basename "$ver_dir")

                # Legacy version folders are named "<mod> <version>".
                # Strip the duplicated module name + separator so the asset
                # is <lang>-module-<mod>-<version>.zip, matching manifest URLs.
                for sep in " " "_" "-" "."; do
                  if [ "${ver#"$mod$sep"}" != "$ver" ]; then
                    ver="${ver#"$mod$sep"}"
                    break
                  fi
                done
                [ "$ver" = "$mod" ] && ver=""
                ver=$(printf '%s' "$ver" | tr ' ' '-')

                if [ -n "$ver" ]; then
                  name="${LANG}-module-${mod}-${ver}"
                else
                  name="${LANG}-module-${mod}"
                fi
                zip -r "${name}.zip" "$ver_dir" \
                    --exclude "*.bat" --exclude "*/.git/*" || true
                echo "Packaged ${name}.zip"
              done
            done
          fi

      # ── Recompute coverage + stamp manifest (Python — no jq quoting risk) ──
      - name: Recompute coverage and stamp manifest
        run: |
          python3 << 'PYEOF'
          import json, re, os, glob, datetime

          manifest_path = "manifest.json"
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)

          define_re = re.compile(r"^\s*define\s*\(\s*['\"]([A-Z_][A-Z0-9_]*)['\"]", re.MULTILINE)
          today = datetime.date.today().isoformat()
          lang = manifest.get("language", "")

          for ver in ("2.7.0", "2.7.1", "2.7.3", "2.7.4", "2.8.0"):
              entry = manifest.get("core", {}).get(ver)
              if entry is None:
                  continue

              contract_path = f"core/{ver}/docs/language-contracts/required-constants.json"
              required = {}
              if os.path.isfile(contract_path):
                  with open(contract_path, encoding="utf-8") as cf:
                      required = json.load(cf).get("constants", {})

              provided = set()
              for path in glob.glob(f"core/{ver}/htdocs/**/*.php", recursive=True):
                  with open(path, encoding="utf-8", errors="replace") as pf:
                      provided.update(define_re.findall(pf.read()))

              total = len(required)
              hit   = len(set(required.keys()) & provided) if total else 0
              coverage = round((hit / total) * 100, 1) if total else 0.0

              entry["coverage"] = coverage
              entry["provided"] = hit
              entry["required"] = total
              entry["updated"]  = today
              entry["pinned_tag"] = f"core-{ver}-{today}"
              entry["pinned_download"] = (
                  f"https://github.com/XoopsLanguages/{lang}"
                  f"/releases/download/core-{ver}-{today}/{lang}-core-{ver}.zip"
              )
              print(f"{lang} core {ver}: {hit}/{total} ({coverage}%)")

          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PYEOF

      # ── Dated, immutable release for whatever changed this run (source of ────
      # ── truth for pinned installs). Only created when this run actually ──────
      # ── packaged something. ──────────────────────────────────────────────
      - name: Create dated release
        if: ${{ hashFiles('*.zip') != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ steps.meta.outputs.today }}
          name: "Language pack build -- ${{ steps.meta.outputs.today }}"
          body: |
            Auto-packaged language assets for the files that changed in this
            push, pinned to this date. Immutable -- a new dated tag is
            created each day assets change. The rolling 'latest' release
            below always points to the newest build.
          files: |
            *.zip
            manifest.json
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Update the rolling 'latest' release. Only assets that changed this ───
      # ── run are re-uploaded; action-gh-release replaces an asset only when ───
      # ── a file with that exact name is re-uploaded, so every other asset ─────
      # ── (and its download count / timestamp) is left completely untouched. ───
      # ── No purge step needed -- and none should be added back. ──────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Language Pack"
          body: |
            Auto-packaged language assets. See manifest.json for coverage details.
            Updated: ${{ github.run_id }}
          files: |
            *.zip
            manifest.json
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
